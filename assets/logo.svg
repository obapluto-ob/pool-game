<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="FELTORA logo">
  <defs>
    <!-- Felt table gradient -->
    <radialGradient id="felt-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e7a4e"/>
      <stop offset="100%" stop-color="#0a3820"/>
    </radialGradient>

    <!-- Wood rim gradient -->
    <linearGradient id="wood-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#8a5a32"/>
      <stop offset="40%"  stop-color="#52321a"/>
      <stop offset="100%" stop-color="#3c2818"/>
    </linearGradient>

    <!-- 8-ball gradient -->
    <radialGradient id="ball-grad" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="60%"  stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Ball shine -->
    <radialGradient id="ball-shine" cx="35%" cy="28%" r="40%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Accent glow filter -->
    <filter id="glow-accent" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gold glow filter -->
    <filter id="glow-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.6)"/>
    </filter>

    <!-- Pocket hole -->
    <radialGradient id="pocket-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#030605"/>
      <stop offset="100%" stop-color="#0a1208"/>
    </radialGradient>

    <!-- Cue gradient -->
    <linearGradient id="cue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d9b27a"/>
      <stop offset="70%"  stop-color="#c49a5a"/>
      <stop offset="100%" stop-color="#5b3a1e"/>
    </linearGradient>

    <!-- Felt texture lines (subtle) -->
    <pattern id="felt-lines" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="8" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
    </pattern>

    <clipPath id="table-clip">
      <rect x="18" y="18" width="164" height="164" rx="20"/>
    </clipPath>
  </defs>

  <!-- ── Outer wood rim ── -->
  <rect x="8" y="8" width="184" height="184" rx="26" fill="url(#wood-rim)" filter="url(#shadow)"/>

  <!-- ── Gold accent border ── -->
  <rect x="12" y="12" width="176" height="176" rx="23" fill="none" stroke="#f0b429" stroke-width="1.2" opacity="0.5"/>

  <!-- ── Felt surface ── -->
  <rect x="18" y="18" width="164" height="164" rx="20" fill="url(#felt-bg)"/>
  <rect x="18" y="18" width="164" height="164" rx="20" fill="url(#felt-lines)" opacity="0.6"/>

  <!-- ── Felt sheen ── -->
  <ellipse cx="100" cy="85" rx="70" ry="50" fill="rgba(124,219,154,0.06)"/>

  <!-- ── Centre line ── -->
  <line x1="100" y1="22" x2="100" y2="178" stroke="rgba(240,180,41,0.18)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- ── Cushion dots ── -->
  <g fill="#f0b429" opacity="0.55">
    <circle cx="60"  cy="21" r="2"/>
    <circle cx="100" cy="21" r="2"/>
    <circle cx="140" cy="21" r="2"/>
    <circle cx="60"  cy="179" r="2"/>
    <circle cx="100" cy="179" r="2"/>
    <circle cx="140" cy="179" r="2"/>
    <circle cx="21"  cy="80" r="2"/>
    <circle cx="21"  cy="120" r="2"/>
    <circle cx="179" cy="80" r="2"/>
    <circle cx="179" cy="120" r="2"/>
  </g>

  <!-- ── Corner pockets ── -->
  <circle cx="22" cy="22" r="9" fill="url(#pocket-grad)"/>
  <circle cx="178" cy="22" r="9" fill="url(#pocket-grad)"/>
  <circle cx="22" cy="178" r="9" fill="url(#pocket-grad)"/>
  <circle cx="178" cy="178" r="9" fill="url(#pocket-grad)"/>
  <!-- pocket rings -->
  <circle cx="22"  cy="22"  r="8" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>
  <circle cx="178" cy="22"  r="8" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>
  <circle cx="22"  cy="178" r="8" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>
  <circle cx="178" cy="178" r="8" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>

  <!-- ── Side pockets ── -->
  <ellipse cx="100" cy="19" rx="8" ry="6" fill="url(#pocket-grad)"/>
  <ellipse cx="100" cy="181" rx="8" ry="6" fill="url(#pocket-grad)"/>
  <ellipse cx="100" cy="19"  rx="7" ry="5" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>
  <ellipse cx="100" cy="181" rx="7" ry="5" fill="none" stroke="rgba(240,180,41,0.4)" stroke-width="1"/>

  <!-- ── Cue stick (animated) ── -->
  <g id="cue-group" transform-origin="155 145">
    <rect id="cue-stick" x="52" y="93" width="110" height="5" rx="2.5"
          fill="url(#cue-grad)"
          transform="rotate(-32, 100, 100)"/>
    <!-- cue tip accent -->
    <rect x="52" y="93" width="8" height="5" rx="2"
          fill="#00e5a0" opacity="0.9"
          transform="rotate(-32, 100, 100)"/>
  </g>

  <!-- ── Aim line (dashed) ── -->
  <line x1="100" y1="100" x2="68" y2="68"
        stroke="rgba(255,255,255,0.35)" stroke-width="1.2"
        stroke-dasharray="4,4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- ── Ghost ball at pocket ── -->
  <circle cx="68" cy="68" r="10"
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Main 8-ball (centre, animated float) ── -->
  <g id="eight-ball" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,-3; 0,0" dur="3s"
                      repeatCount="indefinite" calcMode="spline"
                      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- ball shadow -->
    <ellipse cx="100" cy="116" rx="14" ry="4" fill="rgba(0,0,0,0.35)">
      <animate attributeName="rx" values="14;12;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ball body -->
    <circle cx="100" cy="100" r="22" fill="url(#ball-grad)"/>

    <!-- white circle for number -->
    <circle cx="100" cy="100" r="9" fill="white"/>

    <!-- number 8 -->
    <text x="100" y="105" text-anchor="middle" font-size="11"
          font-weight="900" fill="#111" font-family="'Inter',system-ui,sans-serif">8</text>

    <!-- shine highlight -->
    <circle cx="100" cy="100" r="22" fill="url(#ball-shine)"/>

    <!-- accent ring glow -->
    <circle cx="100" cy="100" r="23" fill="none"
            stroke="#00e5a0" stroke-width="1.5" opacity="0.5" filter="url(#glow-accent)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="23;25;23" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Solid ball (top-right area) ── -->
  <g opacity="0.85">
    <circle cx="148" cy="62" r="11" fill="#2b5fc4" filter="url(#shadow)"/>
    <circle cx="148" cy="62" r="4.5" fill="white"/>
    <text x="148" y="65.5" text-anchor="middle" font-size="5.5"
          font-weight="900" fill="#111" font-family="system-ui,sans-serif">2</text>
    <circle cx="148" cy="62" r="11" fill="url(#ball-shine)"/>
  </g>

  <!-- ── Stripe ball (bottom-left area) ── -->
  <g opacity="0.85">
    <circle cx="52" cy="138" r="11" fill="white" filter="url(#shadow)"/>
    <rect x="41" y="133" width="22" height="10" fill="#d6382f" rx="0"/>
    <clipPath id="stripe-clip"><circle cx="52" cy="138" r="11"/></clipPath>
    <rect x="41" y="133" width="22" height="10" fill="#d6382f" clip-path="url(#stripe-clip)"/>
    <circle cx="52" cy="138" r="4.5" fill="white"/>
    <text x="52" y="141.5" text-anchor="middle" font-size="5.5"
          font-weight="900" fill="#111" font-family="system-ui,sans-serif">11</text>
    <circle cx="52" cy="138" r="11" fill="url(#ball-shine)"/>
  </g>

  <!-- ── Interactive hover overlay (invisible, triggers CSS) ── -->
  <rect x="8" y="8" width="184" height="184" rx="26" fill="transparent"
        class="logo-hover-target" style="cursor:pointer"/>

  <!-- ── Hover pulse ring ── -->
  <circle cx="100" cy="100" r="90" fill="none"
          stroke="#00e5a0" stroke-width="0" opacity="0"
          class="logo-pulse-ring">
    <animate attributeName="r" values="22;38;22" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.15;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="stroke-width" values="2;0;2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <style>
    #eight-ball { cursor: pointer; }
    #eight-ball:hover circle:first-of-type {
      filter: brightness(1.3);
    }
    .logo-hover-target:hover ~ * {}

    /* spin on click via JS class */
    .logo-spin #eight-ball {
      animation: logo-ball-spin 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes logo-ball-spin {
      0%   { transform: scale(1) rotate(0deg); }
      40%  { transform: scale(1.18) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    .logo-spin #cue-group {
      animation: cue-strike 0.4s ease-out;
    }
    @keyframes cue-strike {
      0%   { transform: translateX(0); }
      30%  { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
  </style>
</svg>
